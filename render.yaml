# Render Blueprint for the FastApply API. In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: fastapply-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # you'll be prompted for it; never commit it
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://fastapply.vercel.app
      - key: ALLOWED_ORIGIN_REGEX
        value: https://fastapply-.*\.vercel\.app
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
